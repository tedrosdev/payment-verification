services:
  postgres:
    image: postgres:16-alpine
    container_name: payment_verification_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: payment_verification
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: payment_verification_api
    restart: always
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/payment_verification?schema=public
      JWT_ACCESS_SECRET: super-secret-access-token-key-change-in-prod
      JWT_REFRESH_SECRET: super-secret-refresh-token-key-change-in-prod
      VERIFY_ET_API_KEY: mock-verify-et-api-key
      VERIFY_ET_BASE_URL: https://verify.et
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: payment_verification_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api/v1
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: payment_verification_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
